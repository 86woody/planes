name: gate
on: [push, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y wmctrl x11-utils xdotool xterm openbox tmux xvfb dbus-x11
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a dbus-run-session -- bash -c 'openbox & sleep 1; npm run gate'
