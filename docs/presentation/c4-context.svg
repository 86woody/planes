<rect x="684.7" y="289.0" width="230.60000000000002" height="42" rx="6" fill="#0F1B2D" opacity="0.92"/>
<text x="800.0" y="306.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="400" text-anchor="middle" opacity="1">Watches cards, clicks RESTORE</text>
<text x="800.0" y="323.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="400" text-anchor="middle" opacity="1">(browser page)</text>
