<text x="480.0" y="451.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="400" text-anchor="middle" opacity="1">Hook events</text>
<text x="480.0" y="468.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="400" text-anchor="middle" opacity="1">(stdin JSON, argv)</text>
<line x1="1042" y1="470" x2="1198" y2="470" stroke="#C5D2E0" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1060.2" y="411.0" width="119.60000000000001" height="42" rx="6" fill="#0F1B2D" opacity="0.92"/>
<text x="1120.0" y="428.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="400" text-anchor="middle" opacity="1">Notify, focus,</text>
<text x="1120.0" y="445.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="400" text-anchor="middle" opacity="1">maximize</text>
