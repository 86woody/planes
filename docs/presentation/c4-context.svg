<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<title>Mission Control - C4 system context</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C5D2E0"/></marker><marker id="ahT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00C2A8"/></marker></defs>
<rect width="1600" height="960" fill="#0F1B2D"/>
<text x="60" y="64" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#00C2A8" font-weight="700" text-anchor="start" opacity="1">MISSION CONTROL</text>
<text x="60" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start" opacity="1">C4 level 1 — system context</text>
<circle cx="800" cy="66" r="24" fill="#162740" stroke="#FFB454" stroke-width="2"/>
<rect x="640" y="90" width="320" height="132" rx="14" fill="#162740" stroke="#FFB454" stroke-width="2"/>
<rect x="658" y="106" width="34" height="5" rx="2" fill="#FFB454"/>
<text x="800.0" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">Developer</text>
<text x="800.0" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#FFB454" font-weight="600" text-anchor="middle" opacity="1">[Person]</text>
<text x="800.0" y="188" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Runs many agent sessions. Watches the</text>
<text x="800.0" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">board and restores windows.</text>
<rect x="560" y="400" width="480" height="190" rx="14" fill="#11314A" stroke="#00C2A8" stroke-width="2"/>
<rect x="578" y="416" width="34" height="5" rx="2" fill="#00C2A8"/>
<text x="800.0" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">Mission Control</text>
<text x="800.0" y="472" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#00C2A8" font-weight="600" text-anchor="middle" opacity="1">[Software system, local only: 127.0.0.1:47800]</text>
<text x="800.0" y="498" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Shows each agent and terminal session as a card. Raises an</text>
<text x="800.0" y="517" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">OS notification when a session needs attention. RESTORE</text>
<text x="800.0" y="536" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">brings the window forward and maximizes it.</text>
<rect x="60" y="380" width="340" height="230" rx="14" fill="#101824" stroke="#6E8299" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="78" y="396" width="34" height="5" rx="2" fill="#6E8299"/>
<text x="230.0" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">AI agents and shells</text>
<text x="230.0" y="452" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="600" text-anchor="middle" opacity="1">[External: Claude Code, Codex CLI, Copilot CLI]</text>
<text x="230.0" y="478" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Each agent runs in a terminal or in VS</text>
<text x="230.0" y="497" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Code. Hooks (Claude Code, Copilot) and</text>
<text x="230.0" y="516" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">the notify program (Codex) send each</text>
<text x="230.0" y="535" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">event. A shell prompt hook covers plain</text>
<text x="230.0" y="554" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">terminals.</text>
<rect x="1200" y="380" width="340" height="230" rx="14" fill="#101824" stroke="#6E8299" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="1218" y="396" width="34" height="5" rx="2" fill="#6E8299"/>
<text x="1370.0" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">Operating system</text>
<text x="1370.0" y="452" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="600" text-anchor="middle" opacity="1">[External: Windows 11, macOS 13+, Linux]</text>
<text x="1370.0" y="478" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Window manager and notification centre.</text>
<text x="1370.0" y="497" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Toasts, D-Bus or terminal-notifier.</text>
<text x="1370.0" y="516" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Focus and maximize through Win32, AX,</text>
<text x="1370.0" y="535" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">wmctrl or the compositor.</text>
<rect x="560" y="700" width="480" height="170" rx="14" fill="#101824" stroke="#6E8299" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="578" y="716" width="34" height="5" rx="2" fill="#6E8299"/>
<text x="800.0" y="750" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">VS Code</text>
<text x="800.0" y="772" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="600" text-anchor="middle" opacity="1">[External: editor, one bridge extension per window]</text>
<text x="800.0" y="798" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Hosts integrated terminals and the Claude Code panel. The</text>
<text x="800.0" y="817" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">bridge tells the daemon which terminal belongs to which</text>
<text x="800.0" y="836" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">session.</text>
<rect x="60" y="720" width="340" height="150" rx="14" fill="#101824" stroke="#6E8299" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="78" y="736" width="34" height="5" rx="2" fill="#6E8299"/>
<text x="230.0" y="770" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" opacity="1">Web browser</text>
<text x="230.0" y="792" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="600" text-anchor="middle" opacity="1">[External]</text>
<text x="230.0" y="818" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Shows the board page from the daemon.</text>
<text x="230.0" y="837" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#AFBECF" font-weight="400" text-anchor="middle" opacity="1">Cookie + CSRF pairing.</text>
