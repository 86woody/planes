<rect x="1045.4" y="564.0" width="149.20000000000002" height="42" rx="6" fill="#0F1B2D" opacity="0.92"/>
<text x="1120.0" y="581.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="400" text-anchor="middle" opacity="1">Toast click:</text>
<text x="1120.0" y="598.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C5D2E0" font-weight="400" text-anchor="middle" opacity="1">mission-control://</text>
